[tox]
toxworkdir = /tmp/.tox
envlist =
    lint
    py310-django{42,52}
    py311-django{42,52}
    py312-django{42,52,60}
    py313-django{52,60}
    py314-django60

[testenv]
commands = python runtests.py {posargs}
deps =
    moto[s3]>=5
    django42: Django>=4.2,<4.3
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1

[testenv:lint]
skip_install = true
deps = ruff
commands =
    ruff format --check .
    ruff check .
